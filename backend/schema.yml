components:
  schemas:
    AnalysisStatusEnum:
      enum:
      - not_started
      - partial
      - complete
      type: string
      description: |-
        * `not_started` - not_started
        * `partial` - partial
        * `complete` - complete
    AnalyticsOverdueWork:
      type: object
      properties:
        overdue_invitations:
          type: integer
        overdue_reviews:
          type: integer
        total:
          type: integer
      required:
      - overdue_invitations
      - overdue_reviews
      - total
    AnalyticsSectionCount:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        submission_count:
          type: integer
      required:
      - id
      - name
      - submission_count
    AnalyticsStatusCount:
      type: object
      properties:
        code:
          type: string
        label:
          type: string
        count:
          type: integer
      required:
      - code
      - count
      - label
    AnalyticsTimePoint:
      type: object
      properties:
        month:
          type: string
          format: date
        count:
          type: integer
      required:
      - count
      - month
    AnalyticsTopicCount:
      type: object
      properties:
        label:
          type: string
        submission_count:
          type: integer
      required:
      - label
      - submission_count
    AnalyticsTopicDistribution:
      type: object
      properties:
        topics:
          type: array
          items:
            $ref: '#/components/schemas/AnalyticsTopicCount'
        unclassified_count:
          type: integer
      required:
      - topics
      - unclassified_count
    AssignEditorRequest:
      type: object
      properties:
        editor_id:
          type: string
          format: uuid
          writeOnly: true
      required:
      - editor_id
    AssignSectionManagerRequest:
      type: object
      properties:
        manager_id:
          type: string
          format: uuid
          writeOnly: true
      required:
      - manager_id
    AssignmentReasonEnum:
      enum:
      - INITIAL
      - WORKLOAD
      - CONFLICT
      - INACTIVITY
      - UNAVAILABLE
      - ADMINISTRATIVE
      type: string
      description: |-
        * `INITIAL` - Initial assignment
        * `WORKLOAD` - Workload
        * `CONFLICT` - Conflict of interest
        * `INACTIVITY` - Editor inactivity
        * `UNAVAILABLE` - Editor unavailable
        * `ADMINISTRATIVE` - Administrative correction
    AuthorDashboard:
      type: object
      properties:
        summary:
          allOf:
          - $ref: '#/components/schemas/AuthorDashboardSummary'
          readOnly: true
        action_required:
          type: array
          items:
            $ref: '#/components/schemas/AuthorDashboardAction'
          readOnly: true
        recent_submissions:
          type: array
