          pattern: ^\d{4}-\d{4}$
          maxLength: 9
        manager:
          allOf:
          - $ref: '#/components/schemas/SectionManagerBrief'
          nullable: true
          readOnly: true
        is_active:
          type: boolean
          description: Inactive sections do not accept new submissions.
        created_at:
          type: string
          format: date-time
          readOnly: true
        last_clustered_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
          description: Timestamp of the last successful BERTopic clustering run for
            this section.
