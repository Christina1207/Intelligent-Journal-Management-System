openapi: 3.0.3
info:
  title: Journal Management API
  version: 1.0.0
  description: API documentation for the Journal Management System
paths:
  /api/v1/auth/login/:
    post:
      operationId: api_v1_auth_login_create
      description: |-
        Takes a set of user credentials and returns an access and refresh JSON web
        token pair to prove the authentication of those credentials.
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenObtainPairRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenObtainPairRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenObtainPairRequest'
        required: true
      security:
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenObtainPair'
          description: ''
  /api/v1/auth/me/:
    get:
      operationId: api_v1_auth_me_retrieve
      tags:
      - Auth
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
          description: ''
    patch:
      operationId: api_v1_auth_me_partial_update
      tags:
      - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedCurrentUserProfileUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedCurrentUserProfileUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedCurrentUserProfileUpdateRequest'
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
          description: ''
  /api/v1/auth/register/:
    post:
      operationId: api_v1_auth_register_create
      tags:
      - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationResponse'
          description: ''
  /api/v1/auth/reviewer/profile/:
    patch:
      operationId: api_v1_auth_reviewer_profile_partial_update
      description: Update the authenticated reviewer's expertise profile.
      tags:
      - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedReviewerProfileRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedReviewerProfileRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedReviewerProfileRequest'
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewerProfile'
          description: ''
        '400':
          description: Invalid reviewer profile data.
        '401':
          description: Authentication credentials were not provided.
        '403':
          description: Only reviewers can update a reviewer profile.
  /api/v1/auth/reviewer/profile/sync-orcid/:
    post:
      operationId: api_v1_auth_reviewer_profile_sync_orcid_create
      description: |-
        Manually trigger ORCID sync and embedding regeneration
        for the authenticated reviewer.
        Returns 202 Accepted immediately — task runs async.
        Poll GET /api/v1/auth/me/ to check sync_status and last_synced_at.
      tags:
      - Auth
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailMessage'
          description: ''
  /api/v1/auth/token/refresh/:
    post:
      operationId: api_v1_auth_token_refresh_create
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
        required: true
      security:
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /api/v1/editor/assignments/{assignment_id}/cancel/:
    post:
      operationId: api_v1_editor_assignments_cancel_create
      parameters:
      - in: path
        name: assignment_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Editorial Reviews
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewerAssignmentCancelRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ReviewerAssignmentCancelRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ReviewerAssignmentCancelRequest'
        required: true
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewerAssignment'
          description: ''
  /api/v1/editor/assignments/{assignment_id}/expire/:
    post:
      operationId: api_v1_editor_assignments_expire_create
      parameters:
      - in: path
        name: assignment_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Editorial Reviews
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewerAssignment'
          description: ''
  /api/v1/editor/assignments/{assignment_id}/replace/:
    post:
      operationId: api_v1_editor_assignments_replace_create
      parameters:
      - in: path
        name: assignment_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Editorial Reviews
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewerAssignmentReplaceRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ReviewerAssignmentReplaceRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ReviewerAssignmentReplaceRequest'
        required: true
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewerAssignment'
          description: ''
  /api/v1/editor/queue/:
    get:
      operationId: api_v1_editor_queue_list
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - api
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedSubmissionListList'
          description: ''
  /api/v1/editor/submissions/{submission_id}/assign-reviewer/:
    post:
      operationId: api_v1_editor_submissions_assign_reviewer_create
      parameters:
      - in: path
        name: submission_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Editorial Reviews
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewerAssignmentCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ReviewerAssignmentCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ReviewerAssignmentCreateRequest'
        required: true
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewerAssignment'
          description: ''
  /api/v1/editor/submissions/{submission_id}/assign-reviewers/:
    post:
      operationId: api_v1_editor_submissions_assign_reviewers_create
      parameters:
      - in: path
        name: submission_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Editorial Reviews
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewerAssignmentsBulkCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ReviewerAssignmentsBulkCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ReviewerAssignmentsBulkCreateRequest'
        required: true
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewerAssignmentsBulkResponse'
          description: ''
  /api/v1/editor/submissions/{submission_id}/decision/:
    post:
      operationId: api_v1_editor_submissions_decision_create
      parameters:
      - in: path
        name: submission_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Editorial Reviews
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EditorDecisionRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/EditorDecisionRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EditorDecisionRequest'
        required: true
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmissionVersionDecision'
          description: ''
  /api/v1/editor/submissions/{submission_id}/reviewer-candidates/:
    get:
      operationId: api_v1_editor_submissions_reviewer_candidates_retrieve
      parameters:
      - in: query
        name: limit
        schema:
          type: integer
          maximum: 50
          minimum: 1
          default: 20
      - in: query
        name: search
        schema:
          type: string
          default: ''
          maxLength: 100
      - in: path
        name: submission_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Editorial Reviews
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewerCandidateSearchResponse'
          description: ''
  /api/v1/editor/submissions/{submission_id}/reviewer-recommendations/:
    get:
      operationId: api_v1_editor_submissions_reviewer_recommendations_retrieve
      parameters:
      - in: query
        name: limit
        schema:
          type: integer
        description: Maximum number of recommendations. The server caps this at REVIEWER_RECOMMENDATION_COUNT.
      - in: path
        name: submission_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Editorial Reviews
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewerRecommendationsResponse'
          description: ''
  /api/v1/editor/submissions/{submission_id}/reviews/:
    get:
      operationId: api_v1_editor_submissions_reviews_retrieve
      parameters:
      - in: path
        name: submission_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Editorial Reviews
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EditorReviewWorkspace'
          description: ''
  /api/v1/manager/monitoring/:
    get:
      operationId: api_v1_manager_monitoring_list
      description: List active manuscripts in sections managed by the authenticated
        Section Manager, including reviewer progress and attention flags.
      summary: Monitor active manuscripts
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: status
        schema:
          type: string
          enum:
          - ASSIGNED
          - REVIEWED
          - REVISED
          - SUSPENDED
          - UNDER_REVIEW
          - UNDER_REVISION
        description: Optionally filter manuscripts by workflow status.
      tags:
      - api
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedManagerMonitoringSubmissionList'
          description: ''
  /api/v1/manager/queue/:
    get:
      operationId: api_v1_manager_queue_list
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - api
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedSubmissionListList'
          description: ''
  /api/v1/manager/submissions/{submission_id}/:
    get:
      operationId: api_v1_manager_submissions_retrieve
      description: Return the manuscript metadata required by a Section Manager during
        initial triage. The private storage object path is never exposed.
      summary: Get a managed manuscript for initial triage
      parameters:
      - in: path
        name: submission_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - api
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagerSubmissionDetail'
          description: ''
  /api/v1/manager/submissions/{submission_id}/assign-editor/:
    post:
      operationId: api_v1_manager_submissions_assign_editor_create
      description: Assign an eligible Section Editor to a submitted manuscript belonging
        to a section managed by the authenticated user.
      summary: Assign a Section Editor
      parameters:
      - in: path
        name: submission_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignEditorRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AssignEditorRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AssignEditorRequest'
        required: true
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmissionAssignment'
          description: ''
  /api/v1/manager/submissions/{submission_id}/desk-reject/:
    post:
      operationId: api_v1_manager_submissions_desk_reject_create
      summary: Desk reject a submitted manuscript
      parameters:
      - in: path
        name: submission_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeskRejectRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DeskRejectRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DeskRejectRequest'
        required: true
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TriageAssessmentDetail'
          description: ''
  /api/v1/manager/submissions/{submission_id}/eligible-editors/:
    get:
      operationId: api_v1_manager_submissions_eligible_editors_list
      description: List active Section Editors eligible for this manuscript's section,
        ordered by active assignment workload.
      summary: List eligible Section Editors
      parameters:
      - in: path
        name: submission_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - api
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EligibleSectionEditor'
          description: ''
  /api/v1/manager/submissions/{submission_id}/manuscript/:
    get:
      operationId: api_v1_manager_submissions_manuscript_retrieve
      description: Generate a short-lived presigned URL for the latest manuscript
        version. The MinIO object path is not returned.
      summary: Get a temporary manuscript download URL
      parameters:
      - in: path
        name: submission_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - api
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagerManuscriptDownload'
          description: ''
  /api/v1/manager/submissions/{submission_id}/reassign-editor/:
    post:
      operationId: api_v1_manager_submissions_reassign_editor_create
      description: Replace the current Section Editor while preserving the previous
        assignment as history.
      summary: Reassign a Section Editor
      parameters:
      - in: path
        name: submission_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReassignEditorRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ReassignEditorRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ReassignEditorRequest'
        required: true
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmissionAssignment'
          description: ''
  /api/v1/manager/submissions/{submission_id}/triage/:
    get:
      operationId: api_v1_manager_submissions_triage_retrieve
      summary: Get initial triage assessment
      parameters:
      - in: path
        name: submission_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - api
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TriageAssessmentDetail'
          description: ''
    patch:
      operationId: api_v1_manager_submissions_triage_partial_update
      summary: Save initial triage draft
      parameters:
      - in: path
        name: submission_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedTriageUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedTriageUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedTriageUpdateRequest'
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TriageAssessmentDetail'
          description: ''
  /api/v1/manager/submissions/{submission_id}/triage/complete/:
    post:
      operationId: api_v1_manager_submissions_triage_complete_create
      summary: Complete triage for editor assignment
      parameters:
      - in: path
        name: submission_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - api
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TriageAssessmentDetail'
          description: ''
  /api/v1/public/articles/:
    get:
      operationId: api_v1_public_articles_list
      description: List publicly published articles. Draft and retracted articles
        are never included.
      parameters:
      - in: query
        name: issue
        schema:
          type: string
        description: Filter published articles by issue slug.
      - in: query
        name: language
        schema:
          type: string
        description: Filter published articles by language code.
      - in: query
        name: ordering
        schema:
          type: string
          enum:
          - -download_count
          - -downloads
          - -published_at
          - -title
          - -view_count
          - -views
          - download_count
          - downloads
          - published_at
          - title
          - view_count
          - views
        description: Order published articles by a supported public field.
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: page_size
        schema:
          type: integer
        description: 'Number of results per page. Maximum: 50.'
      - in: query
        name: search
        schema:
          type: string
        description: Search published article titles, abstracts, DOI, and author names.
      - in: query
        name: section
        schema:
          type: string
        description: Filter published articles by section slug or section UUID.
      - in: query
        name: year
        schema:
          type: integer
        description: Filter published articles by publication year.
      tags:
      - Public Articles
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedPublishedArticlePublicListList'
          description: ''
  /api/v1/public/articles/{slug}/:
    get:
      operationId: api_v1_public_articles_retrieve
      description: Retrieve one publicly published article by slug and increment its
        view count.
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - Public Articles
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublishedArticlePublicDetail'
          description: ''
        '404':
          description: Published article was not found.
  /api/v1/public/articles/{slug}/download/:
    get:
      operationId: api_v1_public_articles_download_retrieve
      description: Generate a temporary public download URL for a published article
        PDF. Draft and retracted articles return 404.
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - Public Articles
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublishedArticleDownload'
              examples:
                MinIOPresignedURL:
                  value:
                    download_url: https://minio.example.com/ijms/submissions/article/v1/manuscript.pdf?X-Amz-Signature=...
                    expires_in: 3600
                  summary: MinIO presigned URL
          description: Temporary download URL for the published article PDF.
        '404':
          description: Published article or downloadable PDF was not found.
        '503':
          description: The article download URL could not be generated.
  /api/v1/public/articles/{slug}/export/:
    get:
      operationId: api_v1_public_articles_export_retrieve
      description: Export citation-manager-compatible metadata for a published article.
        Draft and retracted articles return 404.
      parameters:
      - in: query
        name: format
        schema:
          type: string
          enum:
          - bib
          - bibtex
          - dc
          - dublin-core
          - dublin_core
          - ris
          - xml
        description: 'Metadata export format. Supported aliases: bibtex, bib, ris,
          dc, dublin-core, dublin_core, xml.'
        required: true
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - Public Articles
      responses:
        '200':
          content:
            application/json:
              schema:
